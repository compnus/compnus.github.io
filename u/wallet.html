<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../head.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../script.js" defer></script>
    <script src="wallet.js" defer></script>
    <title>Wallet - CompNUS</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="profile.css" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZW8SQ3EQ1B"></script><script>window.dataLayer = window.dataLayer || [];  function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-ZW8SQ3EQ1B');</script></head>
<body>
    <script>
        initHeader("Wallet");

        WINUS = `
        $NUS is our own cryptocurrency, which will be launching on Solana after most of it has been airdropped to users through mining and dividends.<br>
        <b>Total Supply:</b> 10 000 000 $NUS (10 Million)<br>
        <br>
        After the launch, you will be able to withdraw $NUS into your Solana wallet.<br>
        You can already use $NUS on CompNUS to pay for services, purchase Nocas, and more!
        `;

        WINocas = `
        Nocas are a centralized currency used on CompNUS to pay for services, network fees and more.<br>
        They have no real value outside of CompNUS.
        `;

        WIBTC = `
        Satoshi is a smaller division of Bitcoin, commonly used due to Bitcoin's high value.<br>
        <b>1 SAT = 0.00000001 BTC</b><br>
        `;

        WICoins = `
        Marks are a centralized currency used on CompNUS, which you can use to purchase items of real value in the shop. They are pseudo-stable relative to the US Dollar.
        `;
    </script>

    <div class="mainscroll mainwallet pcmarginfix">
        <div class="flex cc">
            <button onclick="loadWallet()">Refresh Wallet</button>
            <span>&emsp;</span>
            <button onclick="location.assign('transactions.html')">Transactions</button>
        </div>


        <div class="walletgridline">
            <img src="../site/image/logo/currency.svg" class="currencylogo" />
            <h1>NUS</h1>
            <h2 class="currencydisplay" id="walletnus">Loading...</h2>

            <div class="bottomacts">
                <img onclick="popup('What is NUS?', WINUS)" title="Coin Info" src="https://img.icons8.com/?size=100&id=83180&format=png&color=FFFFFF">
                <img onclick="convertNocas()" title="Exchange for Nocas" src="../site/icon/exchangenocas.png">
                <img onclick="location.assign('../crypto/nus/dividends.html')" title="Get Dividends" src="https://img.icons8.com/?size=100&id=85952&format=png&color=FFFFFF">
                <img onclick="location.assign('../crypto/nus/')" title="$NUS Mining" src="https://img.icons8.com/?size=100&id=3hnKkALv4z7Y&format=png&color=FFFFFF">
            </div>
        </div>
        <div class="walletgridline">
            <img src="../site/image/logo/noca.svg" class="currencylogo" />
            <h1>Nocas</h1>
            <h2 class="currencydisplay" id="walletnoca">Loading...</h2>

            <div class="bottomacts">
                <img onclick="popup('What are Nocas?', WINocas)" title="What are Nocas?" src="https://img.icons8.com/?size=100&id=83180&format=png&color=FFFFFF">
                <img onclick="convertNocas()" title="Exchange for $NUS" src="../site/icon/exchangenus.png">
                <img onclick="convertNocas(true)" title="Exchange for Bitcoin Satoshi" src="../site/icon/exchangesats.png">
                <img onclick="location.assign('../crypto/nus/free.html')" title="Free Nocas" src="https://img.icons8.com/?size=100&id=85174&format=png&color=FFFFFF">
            </div>
        </div>
        <div class="walletgridline">
            <img src="../site/image/logo/sats.svg" class="currencylogo" />
            <h1>Bitcoin Satoshi</h1>
            <h2 class="currencydisplay" id="walletsats">Loading...</h2>

            <div class="bottomacts">
                <img onclick="popup('What is Bitcoin Satoshi?', WIBTC)" title="Coin Info" src="https://img.icons8.com/?size=100&id=83180&format=png&color=FFFFFF">
                <img onclick="convertNocas(true)" title="Exchange for Nocas" src="../site/icon/exchangenocas.png">
                <img onclick="purchaseMarks()" title="Exchange for Marks" src="../site/icon/exchangecoins.png">
                <img onclick="location.assign('../crypto/nus/dividends.html')" title="Get Dividends" src="https://img.icons8.com/?size=100&id=85952&format=png&color=FFFFFF">
                <img onclick="withdraw()" title="Withdraw" src="https://img.icons8.com/?size=100&id=89853&format=png&color=FFFFFF">
                <hr>
                <p>= <span id="bitcoinss">0.00000000</span> BTC &asymp; $<span id="bitcoinpr">0.000</span></p>
                <p class="corr" onclick="popup('What is this?','Approximate value of your Bitcoin Satoshi based on the current price of Bitcoin (provided by CoinLore).')">?</p>
            </div>
        </div>

        <div class="walletgridline">
            <img src="../site/image/logo/coins.svg" class="currencylogo" />
            <h1>Marks</h1>
            <h2 class="currencydisplay" id="walletcoins">Loading...</h2>

            <div class="bottomacts">
                <img onclick="popup('What are Marks?', WICoins)" title="What are Marks?" src="https://img.icons8.com/?size=100&id=83180&format=png&color=FFFFFF">
                <img onclick="purchaseMarks()" title="Purchase for Bitcoin Satoshi" src="../site/icon/exchangesats.png">
                <img onclick="location.assign('shop.html')" title="Shop" src="https://img.icons8.com/?size=100&id=85180&format=png&color=FFFFFF">
                <hr>
                <p>&asymp; $<span id="markspr">0.000</span></p>
                <p class="corr" onclick="popup('Value of Marks', `Buy Price: <span id='marksbuy'>Loading...</span> $<br>Value: <span id='markssell'>Loading...</span> $`); setMarks()">?</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const { user, data } = await getUser();

            if (!user) {
                window.location.href = "/u/login.html";
                return;
            }

            loadWallet();
        });

        initFooter();
    </script>
</body>
</html>
